# Copies product pictures from other websites into data/images and points
# the CSVs at them. Runs when the data CSVs change, or by hand (Actions tab).
name: Mirror images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/*.csv", ".github/scripts/mirror_images.py"]
permissions:
  contents: write
  pages: write
concurrency:
  group: mirror-images
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python .github/scripts/mirror_images.py
      - name: Commit the pictures
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Mirror product pictures into data/images"
          for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
          # pushes made by this workflow don't always start a Pages build on their own
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
